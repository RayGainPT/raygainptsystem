name: zenstay
description: ZenStay booking PWA
publish_to: 'none'
environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.1.0
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  riverpod: ^3.2.1
  image_picker: ^1.2.1
  firebase_storage: ^13.0.6
  js: ^0.7.2
  google_fonts: ^8.0.2
  flutter_colorpicker: ^1.1.0
  url_launcher: ^6.1.7
  firebase_auth: ^6.1.4
  pdf: ^3.10.1
  printing: ^5.10.0
  intl: ^0.18.0
  table_calendar: ^3.0.9
  file_picker: ^10.3.10
  syncfusion_flutter_pdf: any

flutter:
  uses-material-design: true
  assets:
    - assets/pmo_form.pdf
